<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐤 Chirper — 3D Edition</title>
    <style>
        :root {
            --bg: #06060f;
            --card-bg: rgba(15, 15, 40, 0.8);
            --primary: #0088ff;
            --primary-glow: #00bbff;
            --accent: #0066dd;
            --text: #e0e8ff;
            --text-dim: #88aacc;
            --border: rgba(0, 150, 255, 0.2);
            --success: #00ff88;
            --danger: #ff4477;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Анимированный фон */
        .bg-animation {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 120, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 180, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0, 100, 255, 0.05) 0%, transparent 50%);
        }

        /* Сетка */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.05;
            background-image:
                linear-gradient(rgba(0, 150, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Партиклы */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            width: 2px; height: 2px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--primary-glow), 0 0 12px var(--primary);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Контейнер */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            padding: 20px;
        }

        /* Навбар с 3D */
        .navbar {
            position: sticky;
            top: 20px;
            z-index: 100;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateX(2deg);
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(0, 136, 255, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 24px;
        }

        .navbar:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-2px);
            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(0, 136, 255, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-glow), #ffffff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(0, 187, 255, 0.5));
            letter-spacing: -1px;
            text-decoration: none;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #0088ff, #00ccff);
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.6), 0 0 30px rgba(0, 187, 255, 0.3);
            animation: verifiedPulse 2s ease-in-out infinite;
        }

        @keyframes verifiedPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 136, 255, 0.6), 0 0 30px rgba(0, 187, 255, 0.3); }
            50% { box-shadow: 0 0 25px rgba(0, 136, 255, 0.9), 0 0 50px rgba(0, 187, 255, 0.6); }
        }

        /* Кнопки */
        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 4px 20px rgba(0, 136, 255, 0.4), 0 0 30px rgba(0, 136, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 136, 255, 0.6), 0 0 50px rgba(0, 187, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            animation: btnShine 3s infinite;
        }

        @keyframes btnShine {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.3);
            background: rgba(0, 136, 255, 0.1);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 8px;
        }

        /* Карточки с 3D */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateX(1deg);
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(0, 136, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardAppear 0.6s ease-out;
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: perspective(1000px) rotateX(5deg) translateY(20px); }
            100% { opacity: 1; transform: perspective(1000px) rotateX(1deg) translateY(0); }
        }

        .card:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-4px);
            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 136, 255, 0.2);
            border-color: rgba(0, 150, 255, 0.4);
        }

        /* Пост */
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 16px;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.4);
        }

        .post-time {
            color: var(--text-dim);
            font-size: 12px;
        }

        .post-content {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #dde4ff;
        }

        .post-actions {
            display: flex;
            gap: 20px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            color: var(--primary-glow);
            background: rgba(0, 136, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.2);
        }

        .action-btn.liked {
            color: #ff4477;
            animation: heartBeat 0.6s ease;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* Формы */
        .auth-form, .post-form {
            max-width: 450px;
            margin: 0 auto;
        }

        .auth-form h2, .post-form h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, var(--primary-glow), white);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 30, 60, 0.5);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 136, 255, 0.3), 0 0 40px rgba(0, 136, 255, 0.1);
            background: rgba(0, 40, 80, 0.5);
        }

        .input-group input::placeholder, .input-group textarea::placeholder {
            color: rgba(136, 170, 204, 0.5);
        }

        .input-group .icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 60px rgba(0, 136, 255, 0.2);
            animation: modalIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalIn {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--danger);
        }

        /* Flash-сообщения */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 300;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 600;
            backdrop-filter: blur(20px);
            animation: toastIn 0.4s ease, toastOut 0.4s ease 3s forwards;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @keyframes toastIn {
            0% { opacity: 0; transform: translateX(100px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastOut {
            0% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(100px); }
        }

        .toast-success {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.4);
            color: #00ff88;
        }

        .toast-error {
            background: rgba(255, 68, 119, 0.2);
            border: 1px solid rgba(255, 68, 119, 0.4);
            color: #ff4477;
        }

        /* Загрузка */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 136, 255, 0.3);
            border-top: 2px solid var(--primary-glow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Мобильная адаптация */
        @media (max-width: 600px) {
            .container { padding: 10px; }
            .navbar { padding: 12px 16px; border-radius: 16px; }
            .logo { font-size: 20px; }
            .card { padding: 16px; border-radius: 16px; }
            .btn { padding: 8px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- Фон -->
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>
    <div id="particles"></div>

    <!-- Toast-уведомления -->
    <div id="toastContainer"></div>

    <!-- Контейнер -->
    <div class="container">
        <!-- Навигация -->
        <nav class="navbar">
            <a href="#" class="logo" onclick="showFeed()">🐤 Chirper</a>
            <div class="nav-actions" id="navActions">
                <button class="btn btn-outline btn-sm" onclick="openModal('loginModal')">Войти</button>
                <button class="btn btn-primary btn-sm" onclick="openModal('registerModal')">Регистрация</button>
            </div>
        </nav>

        <!-- Контент -->
        <div id="content"></div>
    </div>

    <!-- Модалка: Вход -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h2 style="color: var(--primary-glow);">Вход</h2>
                <button class="modal-close" onclick="closeModal('loginModal')">&times;</button>
            </div>
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Пароль">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="login()">
                <span id="loginLoader" style="display:none;" class="loader"></span>
                Войти
            </button>
        </div>
    </div>

    <!-- Модалка: Регистрация -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <div class="modal-header">
                <h2 style="color: var(--primary-glow);">Регистрация</h2>
                <button class="modal-close" onclick="closeModal('registerModal')">&times;</button>
            </div>
            <div class="input-group">
                <input type="text" id="regUsername" placeholder="Имя пользователя">
            </div>
            <div class="input-group">
                <input type="email" id="regEmail" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="password" id="regPassword" placeholder="Пароль">
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="register()">
                <span id="regLoader" style="display:none;" class="loader"></span>
                Создать аккаунт
            </button>
        </div>
    </div>

    <!-- Модалка: Профиль -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal" id="profileContent"></div>
    </div>

    <script>
        // ==================== КОНФИГУРАЦИЯ ====================
        const API_URL = 'https://chirper-api-abc.onrender.com'; // Замените на URL вашего сервера
        let token = localStorage.getItem('chirper_token');
        let currentUser = JSON.parse(localStorage.getItem('chirper_user') || 'null');

        // ==================== ПАРТИКЛЫ ====================
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (4 + Math.random() * 8) + 's';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.width = (1 + Math.random() * 3) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        // ==================== API ====================
        async function apiCall(method, endpoint, data = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method,
                    headers,
                    body: data ? JSON.stringify(data) : null
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Ошибка сервера');
                }

                return result;
            } catch (error) {
                if (error.message === 'Failed to fetch') {
                    showToast('Сервер недоступен. Проверьте подключение.', 'error');
                } else {
                    showToast(error.message, 'error');
                }
                return null;
            }
        }

        // ==================== UI ====================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3400);
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function setLoading(buttonId, loaderId, isLoading) {
            const btn = document.querySelector(`#${buttonId}`);
            const loader = document.getElementById(loaderId);
            if (isLoading) {
                btn.disabled = true;
                loader.style.display = 'inline-block';
            } else {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        // ==================== АВТОРИЗАЦИЯ ====================
        async function register() {
            setLoading('registerModal', 'regLoader', true);
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            const result = await apiCall('POST', '/register', { username, email, password });
            setLoading('registerModal', 'regLoader', false);

            if (result && result.token) {
                token = result.token;
                currentUser = result.user;
                localStorage.setItem('chirper_token', token);
                localStorage.setItem('chirper_user', JSON.stringify(currentUser));
                closeModal('registerModal');
                updateNav();
                showFeed();
                showToast(`Добро пожаловать, ${currentUser.username}! 🎉`, 'success');
            }
        }

        async function login() {
            setLoading('loginModal', 'loginLoader', true);
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const result = await apiCall('POST', '/login', { email, password });
            setLoading('loginModal', 'loginLoader', false);

            if (result && result.token) {
                token = result.token;
                currentUser = result.user;
                localStorage.setItem('chirper_token', token);
                localStorage.setItem('chirper_user', JSON.stringify(currentUser));
                closeModal('loginModal');
                updateNav();
                showFeed();
                showToast(`С возвращением, ${currentUser.username}!`, 'success');
            }
        }

        function logout() {
            token = null;
            currentUser = null;
            localStorage.removeItem('chirper_token');
            localStorage.removeItem('chirper_user');
            updateNav();
            showFeed();
            showToast('Вы вышли из аккаунта', 'success');
        }

        function updateNav() {
            const navActions = document.getElementById('navActions');
            if (currentUser) {
                const verifiedHtml = currentUser.verified
                    ? '<span class="verified-badge">✓</span>' : '';
                navActions.innerHTML = `
                    <div class="user-info">
                        <span style="font-weight:600;">${currentUser.username}</span>
                        ${verifiedHtml}
                    </div>
                    <button class="btn btn-outline btn-sm" onclick="showFeed()">Лента</button>
                    <button class="btn btn-outline btn-sm" onclick="showProfile('${currentUser.username}')">Профиль</button>
                    <button class="btn btn-primary btn-sm" onclick="logout()">Выйти</button>
                `;
            } else {
                navActions.innerHTML = `
                    <button class="btn btn-outline btn-sm" onclick="openModal('loginModal')">Войти</button>
                    <button class="btn btn-primary btn-sm" onclick="openModal('registerModal')">Регистрация</button>
                `;
            }
        }

        // ==================== ЛЕНТА ====================
        async function showFeed() {
            const content = document.getElementById('content');
            content.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loader"></div></div>';

            // Форма создания поста
            let postFormHtml = '';
            if (currentUser) {
                postFormHtml = `
                    <div class="card post-form">
                        <textarea id="postContent" placeholder="Что нового? (макс 280 символов)" maxlength="280"></textarea>
                        <button class="btn btn-primary" onclick="createPost()" style="margin-top:12px;width:100%;">
                            🚀 Чирикнуть
                        </button>
                    </div>
                `;
            }

            // Загрузка постов
            const posts = await apiCall('GET', '/posts');
            let postsHtml = '';

            if (posts && posts.length > 0) {
                postsHtml = posts.map(post => `
                    <div class="card">
                        <div class="post-header">
                            <div class="post-author">
                                <div class="post-avatar">${post.author.username[0].toUpperCase()}</div>
                                <div>
                                    <span onclick="showProfile('${post.author.username}')" style="cursor:pointer;">
                                        ${post.author.username}
                                    </span>
                                    ${post.author.verified ? '<span class="verified-badge">✓</span>' : ''}
                                </div>
                            </div>
                            <span class="post-time">${new Date(post.timestamp).toLocaleString('ru-RU')}</span>
                        </div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        <div class="post-actions">
                            <button class="action-btn" onclick="likePost(${post.id}, this)">
                                ❤️ <span class="likes-count">${post.likes}</span>
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                postsHtml = '<div class="card" style="text-align:center;color:var(--text-dim);">Пока нет постов. Будьте первым! 🐤</div>';
            }

            content.innerHTML = postFormHtml + '<h2 style="margin-bottom:16px;color:var(--primary-glow);">📡 Лента</h2>' + postsHtml;
        }

        async function createPost() {
            const content = document.getElementById('postContent').value.trim();
            if (!content) {
                showToast('Напишите что-нибудь!', 'error');
                return;
            }
            if (content.length > 280) {
                showToast('Максимум 280 символов!', 'error');
                return;
            }

            const result = await apiCall('POST', '/post', { content });
            if (result) {
                showToast('Чирик опубликован! 🚀', 'success');
                showFeed();
            }
        }

        async function likePost(postId, button) {
            if (!currentUser) {
                showToast('Войдите, чтобы лайкать!', 'error');
                return;
            }

            const result = await apiCall('POST', `/like/${postId}`);
            if (result) {
                const countSpan = button.querySelector('.likes-count');
                countSpan.textContent = result.likes;
                button.classList.add('liked');
                setTimeout(() => button.classList.remove('liked'), 600);
            }
        }

        // ==================== ПРОФИЛЬ ====================
        async function showProfile(username) {
            const content = document.getElementById('content');
            content.innerHTML = '<div style="text-align:center;padding:40px;"><div class="loader"></div></div>';

            const data = await apiCall('GET', `/user/${username}`);
            if (!data) {
                showFeed();
                return;
            }

            const { user, posts } = data;
            const verifiedHtml = user.verified ? '<span class="verified-badge">✓</span> Проверенный автор' : '';

            let postsHtml = '';
            if (posts && posts.length > 0) {
                postsHtml = posts.map(post => `
                    <div class="card">
                        <div class="post-header">
                            <span class="post-time">${new Date(post.timestamp).toLocaleString('ru-RU')}</span>
                        </div>
                        <div class="post-content">${escapeHtml(post.content)}</div>
                        <div class="post-actions">
                            <span style="color:var(--text-dim);">❤️ ${post.likes}</span>
                        </div>
                    </div>
                `).join('');
            } else {
                postsHtml = '<div class="card" style="text-align:center;color:var(--text-dim);">Нет постов</div>';
            }

            content.innerHTML = `
                <div class="card" style="text-align:center;">
                    <div class="post-avatar" style="width:80px;height:80px;font-size:36px;margin:0 auto 16px;">
                        ${user.username[0].toUpperCase()}
                    </div>
                    <h2>${escapeHtml(user.username)}</h2>
                    <p style="color:var(--primary-glow);margin:8px 0;">${verifiedHtml}</p>
                    <p style="color:var(--text-dim);">${escapeHtml(user.bio || '')}</p>
                </div>
                <h3 style="color:var(--primary-glow);margin:20px 0;">Посты</h3>
                ${postsHtml}
                <button class="btn btn-outline" onclick="showFeed()" style="margin-top:20px;">← Назад в ленту</button>
            `;
        }

        // ==================== УТИЛИТЫ ====================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Закрытие модалок по клику вне
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        });

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        createParticles();
        updateNav();
        showFeed();

        // Обработка Enter в формах
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('loginModal').classList.contains('active')) {
                    login();
                } else if (document.getElementById('registerModal').classList.contains('active')) {
                    register();
                }
            }
        });
    </script>
</body>
</html>
