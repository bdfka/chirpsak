<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐤 Chirper</title>
    <style>
        :root{--bg:#06060f;--card:rgba(15,15,40,0.85);--p:#0088ff;--pg:#00bbff;--a:#0066dd;--t:#e0e8ff;--td:#88aacc;--b:rgba(0,150,255,0.2);--s:#00ff88;--d:#ff4477;--h:#00ccaa;--m:#ffaa00;--on:#00ff88;--off:#666;--in:rgba(0,30,60,0.5)}
        [data-theme="light"]{--bg:#f0f2f5;--card:rgba(255,255,255,0.9);--t:#1a1a2e;--td:#666;--in:rgba(0,0,0,0.05)}
        [data-theme="red"]{--bg:#0a0000;--card:rgba(30,10,10,0.85);--p:#f33;--pg:#f55;--a:#c00;--t:#fee;--td:#c88;--in:rgba(60,0,0,0.5)}
        [data-theme="green"]{--bg:#000a00;--card:rgba(10,30,10,0.85);--p:#0c4;--pg:#0f5;--a:#093;--t:#efe;--td:#8c8;--in:rgba(0,60,0,0.5)}
        [data-theme="yellow"]{--bg:#0a0a00;--card:rgba(30,30,10,0.85);--p:#fc0;--pg:#fd3;--a:#c90;--t:#ffe;--td:#cc8;--in:rgba(60,60,0,0.5)}
        [data-theme="pink"]{--bg:#0a0005;--card:rgba(30,10,25,0.85);--p:#f3a;--pg:#f5c;--a:#c08;--t:#fef;--td:#c8a;--in:rgba(60,0,30,0.5)}
        [data-theme="cyan"]{--bg:#000a0a;--card:rgba(10,30,30,0.85);--p:#0cc;--pg:#0ff;--a:#099;--t:#eff;--td:#8cc;--in:rgba(0,60,60,0.5)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background 0.5s,color 0.5s}
        .bg-anim{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 50%,var(--pg) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,var(--pg) 0%,transparent 50%)}
        .particle{position:fixed;pointer-events:none;z-index:0;width:2px;height:2px;background:var(--p);border-radius:50%;box-shadow:0 0 6px var(--pg),0 0 12px var(--p);animation:float linear infinite}
        @keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1.5);opacity:0}}
        .app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
        .nav{background:var(--card);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,0.3);animation:slideDown 0.5s ease}
        @keyframes slideDown{0%{transform:translateY(-100%)}100%{transform:translateY(0)}}
        .logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--pg),#fff,var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;filter:drop-shadow(0 0 8px var(--pg))}
        .nav-r{display:flex;gap:6px;align-items:center}
        .badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:bold;box-shadow:0 0 10px;animation:badgePulse 2s infinite}
        @keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
        .bw{background:linear-gradient(135deg,#fff,#ccc);color:#000;box-shadow:0 0 12px rgba(255,255,255,0.6)}.bg{background:linear-gradient(135deg,#888,#666);color:#fff;box-shadow:0 0 12px rgba(136,136,136,0.6)}.bb{background:linear-gradient(135deg,#08f,#0cf);color:#fff;box-shadow:0 0 12px rgba(0,136,255,0.6)}
        .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
        .don{background:var(--on);box-shadow:0 0 6px var(--on)}.doff{background:var(--off)}
        .btn{padding:7px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:12px;transition:all 0.3s;display:inline-flex;align-items:center;gap:4px;color:#fff}
        .bp{background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 3px 10px rgba(0,0,0,0.3)}.bp:hover{transform:translateY(-1px);box-shadow:0 5px 15px rgba(0,0,0,0.4)}
        .bo{background:transparent;border:1px solid var(--b);color:var(--t)}.bo:hover{border-color:var(--p)}
        .bs{background:var(--s);color:#000}.bd{background:var(--d)}
        .btn-sm{padding:4px 8px;font-size:10px}
        .fab{position:fixed;bottom:16px;right:16px;z-index:150;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 4px 20px rgba(0,136,255,0.5);border:none;color:#fff;font-size:20px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
        .fab:hover{transform:scale(1.1);box-shadow:0 6px 25px rgba(0,136,255,0.7)}
        .layout{display:flex;flex:1;overflow:hidden}
        .side{width:200px;background:var(--card);border-right:1px solid var(--b);padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
        .side .btn{justify-content:flex-start;position:relative}
        .unread-badge{position:absolute;top:-4px;right:-4px;background:var(--d);color:#fff;border-radius:10px;padding:2px 6px;font-size:10px;font-weight:bold;min-width:18px;text-align:center;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
        .main{flex:1;overflow-y:auto;padding:12px}
        .card{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:8px;animation:cardIn 0.4s ease;transition:all 0.3s}
        @keyframes cardIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
        .card:hover{border-color:var(--p)}
        .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
        .pa{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;cursor:pointer}
        .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;overflow:hidden;flex-shrink:0;box-shadow:0 0 10px rgba(0,136,255,0.3)}
        .av img{width:100%;height:100%;object-fit:cover}
        .pt{color:var(--td);font-size:10px}
        .pc{font-size:14px;line-height:1.5;margin-bottom:8px;word-break:break-word}
        .mention{color:var(--m);cursor:pointer;font-weight:600}.hashtag{color:var(--h);cursor:pointer;font-weight:600}
        .pact{display:flex;gap:10px}
        .abtn{background:none;border:none;color:var(--td);cursor:pointer;font-size:12px;padding:5px 8px;border-radius:6px;transition:all 0.3s;display:flex;align-items:center;gap:3px}
        .abtn:hover{color:var(--pg);background:rgba(0,136,255,0.1)}
        .abtn.liked{color:#ff4477;animation:heartBeat 0.6s}
        @keyframes heartBeat{0%{transform:scale(1)}25%{transform:scale(1.3)}50%{transform:scale(0.9)}100%{transform:scale(1)}}
        input,textarea,select{width:100%;padding:8px 12px;background:var(--in);border:1px solid var(--b);border-radius:8px;color:var(--t);font-size:12px;outline:none;font-family:inherit;transition:all 0.3s}
        textarea{resize:vertical;min-height:70px}
        input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 10px rgba(0,136,255,0.3)}
        .modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:200;justify-content:center;align-items:center}
        .modal-bg.on{display:flex;animation:fadeIn 0.3s}
        @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
        .modal{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:20px;max-width:460px;width:90%;max-height:85vh;overflow-y:auto;animation:modalIn 0.4s}
        @keyframes modalIn{0%{transform:scale(0.8) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
        .modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        .toast{position:fixed;top:12px;right:12px;z-index:300;padding:10px 16px;border-radius:10px;font-weight:600;font-size:12px;animation:toastIn 0.4s,toastOut 0.4s 2.5s forwards}
        @keyframes toastIn{0%{opacity:0;transform:translateX(50px)}100%{opacity:1;transform:translateX(0)}}
        @keyframes toastOut{0%{opacity:1}100%{opacity:0}}
        .ts{background:rgba(0,255,136,0.2);border:1px solid var(--s);color:var(--s)}
        .te{background:rgba(255,68,119,0.2);border:1px solid var(--d);color:var(--d)}
        .fitm{display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:8px;background:var(--in);margin-bottom:4px;transition:all 0.3s}
        .fitm:hover{background:rgba(0,136,255,0.1)}
        .msg{max-width:80%;padding:8px 12px;border-radius:12px;margin:4px 0;font-size:13px;word-break:break-word;animation:msgIn 0.3s}
        @keyframes msgIn{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}
        .msg-m{background:var(--p);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
        .msg-o{background:var(--in);margin-right:auto;border-bottom-left-radius:4px}
        .pav{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin:0 auto 10px;overflow:hidden;box-shadow:0 0 20px rgba(0,136,255,0.4)}
        .pav img{width:100%;height:100%;object-fit:cover}
        .chat-info-btn{cursor:pointer;color:var(--pg);font-size:14px;margin-left:4px}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
        @media(max-width:768px){.side{display:none}.fab{bottom:10px;right:10px}}
    </style>
</head>
<body>
<div class="bg-anim"></div><div id="particles"></div><div id="tc"></div>
<div class="app">
    <nav class="nav"><span class="logo" onclick="sp('feed')">🐤 Chirper</span><div class="nav-r" id="na"><button class="btn bo btn-sm" onclick="om('loginModal')">Войти</button><button class="btn bp btn-sm" onclick="om('registerModal')">Регистрация</button></div></nav>
    <div class="layout">
        <aside class="side">
            <button class="btn bo btn-sm" onclick="sp('feed')">📡 Лента</button>
            <button class="btn bo btn-sm" onclick="sp('hash')">🔥 Хештеги</button>
            <button class="btn bo btn-sm" onclick="sp('friends')">👥 Друзья</button>
            <button class="btn bo btn-sm" onclick="sp('msg')" id="msgBtn">💬 Мессенджер</button>
            <button class="btn bo btn-sm" id="sbtn" onclick="om('settingsModal')" disabled>⚙ Настройки</button>
            <div style="font-size:10px;color:var(--td);margin-top:4px">Тема</div>
            <div style="display:flex;gap:3px;flex-wrap:wrap">
                <span style="background:#06060f;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent" onclick="st('dark')"></span>
                <span style="background:#f0f2f5;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent" onclick="st('light')"></span>
                <span style="background:#0a0000;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent" onclick="st('red')"></span>
                <span style="background:#000a0a;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent" onclick="st('cyan')"></span>
                <span style="background:#000a00;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent" onclick="st('green')"></span>
                <span style="background:#0a0a00;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent" onclick="st('yellow')"></span>
                <span style="background:#0a0005;width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent" onclick="st('pink')"></span>
            </div>
            <div id="sb"></div>
        </aside>
        <main class="main" id="ct"></main>
    </div>
</div>
<button class="fab" onclick="om('postModal')">+</button>
<button class="btn" style="position:fixed;bottom:68px;right:16px;z-index:150;width:28px;height:28px;border-radius:50%;font-size:10px;background:rgba(0,0,0,0.5);color:var(--td)" onclick="ta()">⚙</button>
<div id="ac" style="display:none;position:fixed;bottom:105px;right:16px;z-index:150;background:var(--card);border:1px solid var(--b);border-radius:10px;padding:10px;width:220px;box-shadow:0 10px 30px rgba(0,0,0,0.5)">
    <input type="password" id="apw" placeholder="Пароль" style="margin-bottom:4px">
    <select id="abt" style="margin-bottom:4px"><option value="white">Белая</option><option value="gray">Серая</option><option value="blue">Синяя</option></select>
    <input type="text" id="acmd" placeholder="verify ник" style="margin-bottom:4px">
    <button class="btn bp btn-sm" onclick="ea()" style="width:100%">OK</button>
    <div id="ar" style="font-size:10px;margin-top:4px"></div>
</div>

<div class="modal-bg" id="postModal"><div class="modal"><div class="modal-h"><h3 style="color:var(--pg)">Новый чирик</h3><span onclick="cm('postModal')" style="cursor:pointer;font-size:20px">&times;</span></div><textarea id="ptxt" placeholder="Что нового? @ник #тег" maxlength="280"></textarea><div style="font-size:10px;color:var(--td);margin:4px 0"><span id="cc">0</span>/280</div><button class="btn bp" onclick="pp()" style="width:100%">🚀 Опубликовать</button></div></div>
<div class="modal-bg" id="loginModal"><div class="modal"><div class="modal-h"><h3 style="color:var(--pg)">Вход</h3><span onclick="cm('loginModal')" style="cursor:pointer;font-size:20px">&times;</span></div><input type="email" id="lem" placeholder="Email" style="margin-bottom:8px"><input type="password" id="lpw" placeholder="Пароль" style="margin-bottom:8px"><button class="btn bp" onclick="li()" style="width:100%">Войти</button></div></div>
<div class="modal-bg" id="registerModal"><div class="modal"><div class="modal-h"><h3 style="color:var(--pg)">Регистрация</h3><span onclick="cm('registerModal')" style="cursor:pointer;font-size:20px">&times;</span></div><input type="text" id="ru" placeholder="Ник" style="margin-bottom:8px"><input type="email" id="re" placeholder="Email" style="margin-bottom:8px"><input type="password" id="rp" placeholder="Пароль" style="margin-bottom:8px"><button class="btn bp" onclick="reg()" style="width:100%">Создать</button></div></div>
<div class="modal-bg" id="settingsModal"><div class="modal"><div class="modal-h"><h3 style="color:var(--pg)">⚙ Настройки</h3><span onclick="cm('settingsModal')" style="cursor:pointer;font-size:20px">&times;</span></div><h4 style="font-size:12px;margin-bottom:4px">Аватар</h4><input type="file" id="af" accept="image/*" style="margin-bottom:6px"><button class="btn bp btn-sm" onclick="ua()">Загрузить</button><h4 style="font-size:12px;margin:8px 0 4px">Ник</h4><input type="text" id="nn" placeholder="Новый ник" style="margin-bottom:6px"><button class="btn bp btn-sm" onclick="cn()">Сменить</button><h4 style="font-size:12px;margin:8px 0 4px">Описание</h4><textarea id="nb" placeholder="О себе..." maxlength="200" style="min-height:50px;margin-bottom:6px"></textarea><button class="btn bp btn-sm" onclick="cb()">Сохранить</button><h4 style="font-size:12px;margin:8px 0 4px">Пароль</h4><input type="password" id="op" placeholder="Старый" style="margin-bottom:4px"><input type="password" id="np" placeholder="Новый" style="margin-bottom:4px"><input type="email" id="ce" placeholder="Email" style="margin-bottom:6px"><button class="btn bd btn-sm" onclick="cp()">Сменить</button></div></div>
<div class="modal-bg" id="chatInfoModal"><div class="modal" id="chatInfoContent"></div></div>

<script>
const A='',AP='bdfkatop123';
let uid=localStorage.getItem('u'),un=localStorage.getItem('n'),vf=localStorage.getItem('v'),vt=localStorage.getItem('t')||'',sub=JSON.parse(localStorage.getItem('s')||'[]'),unread={},refreshTimer=null,chatRefresh=null,currentChatId=null;

for(let i=0;i<40;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(4+Math.random()*8)+'s';p.style.animationDelay=Math.random()*8+'s';p.style.width=(1+Math.random()*2)+'px';p.style.height=p.style.width;document.getElementById('particles').appendChild(p)}

function st(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('th',t);document.querySelectorAll('.side span[style]').forEach(b=>b.style.borderColor='transparent')}
function to(m,t='s'){const c=document.getElementById('tc'),d=document.createElement('div');d.className=`toast t${t==='s'?'s':'e'}`;d.textContent=m;c.appendChild(d);setTimeout(()=>d.remove(),2500)}
function om(id){document.getElementById(id).classList.add('on')}
function cm(id){document.getElementById(id).classList.remove('on')}
function bh(v,t){if(!v||v==='false')return'';const c=t==='white'?'bw':t==='gray'?'bg':'bb',s=t==='white'?'◇':t==='gray'?'◆':'✓';return`<span class="badge ${c}">${s}</span>`}
function od(u){return u.online?'<span class="dot don"></span>':`<span class="dot doff" title="${new Date(u.last_seen).toLocaleString('ru-RU')}"></span>`}

async function api(m,e,d=null){
    try{const o={method:m,headers:{'Content-Type':'application/json'}};if(d)o.body=JSON.stringify(d);const r=await fetch(A+e,o),j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}catch(err){to(err.message,'e');return null}
}
async function afi(e,fd){try{const r=await fetch(A+e,{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}catch(err){to(err.message,'e');return null}}
function ta(){document.getElementById('ac').style.display=document.getElementById('ac').style.display==='none'?'block':'none'}
async function ea(){
    const p=document.getElementById('apw').value,c=document.getElementById('acmd').value.trim(),t=document.getElementById('abt').value;
    if(p!==AP){document.getElementById('ar').innerHTML='<span style="color:#f44">Неверный пароль</span>';return}
    const u=c.replace('verify ','').trim(),r=await api('POST','/verify',{username:u,badge_type:t});
    if(r){document.getElementById('ar').innerHTML='<span style="color:#0f8">✅ OK</span>';if(un===u){vf='true';vt=t;localStorage.setItem('v','true');localStorage.setItem('t',t);unv()}}
}
async function reg(){
    const r=await api('POST','/register',{username:document.getElementById('ru').value.trim(),email:document.getElementById('re').value.trim(),password:document.getElementById('rp').value});
    if(r){uid=r.user_id;un=r.username;vf=r.verified?'true':'false';vt=r.badge_type||'';sv();cm('registerModal');unv();sp('feed');to('Добро пожаловать, '+un+'!')}
}
async function li(){
    const r=await api('POST','/login',{email:document.getElementById('lem').value.trim(),password:document.getElementById('lpw').value});
    if(r){uid=r.user_id;un=r.username;vf=r.verified?'true':'false';vt=r.badge_type||'';sv();cm('loginModal');unv();sp('feed');to('С возвращением, '+un+'!');startAutoRefresh()}
}
function lo(){uid=null;un=null;vf='false';localStorage.clear();sub=[];stopAutoRefresh();unv();sp('feed')}
function sv(){localStorage.setItem('u',uid);localStorage.setItem('n',un);localStorage.setItem('v',vf);localStorage.setItem('t',vt)}
function unv(){
    const a=document.getElementById('na'),sb=document.getElementById('sbtn');
    if(uid){a.innerHTML=`<span style="font-weight:600">${un}</span> ${bh(vf,vt)}<button class="btn bo btn-sm" onclick="sp('feed')">Лента</button><button class="btn bp btn-sm" onclick="lo()">Выйти</button>`;sb.disabled=false}
    else{a.innerHTML='<button class="btn bo btn-sm" onclick="om(\'loginModal\')">Войти</button><button class="btn bp btn-sm" onclick="om(\'registerModal\')">Регистрация</button>';sb.disabled=true}
    usub();checkUnread()
}
function usub(){const b=document.getElementById('sb');if(!uid||sub.length===0){b.innerHTML='';return}b.innerHTML='<div style="font-size:10px;color:var(--td);margin:4px 0">Подписки</div>'+sub.map(s=>`<button class="btn bo btn-sm" onclick="spr('${s}')" style="width:100%">@${s}</button>`).join('')}
function ts(u){const i=sub.indexOf(u);if(i>=0){sub.splice(i,1);to('Отписались')}else{sub.push(u);to('Подписались')}localStorage.setItem('s',JSON.stringify(sub));usub()}
function pc(t){return t.replace(/@(\w+)/g,'<span class="mention" onclick="spr(\'$1\')">@$1</span>').replace(/#(\w+)/g,'<span class="hashtag" onclick="sh(\'$1\')">#$1</span>')}

async function ua(){const f=document.getElementById('af').files[0];if(!f)return to('Выберите файл','e');const fd=new FormData();fd.append('avatar',f);fd.append('user_id',uid);await afi('/upload-avatar',fd);to('Аватар обновлён!')}
async function cn(){const n=document.getElementById('nn').value.trim();if(!n)return;const r=await api('POST','/update-profile',{user_id:parseInt(uid),username:n});if(r){un=n;localStorage.setItem('n',un);unv();to('Ник изменён!')}}
async function cb(){await api('POST','/update-profile',{user_id:parseInt(uid),bio:document.getElementById('nb').value.trim()});to('Описание сохранено!')}
async function cp(){const r=await api('POST','/change-password',{user_id:parseInt(uid),old_password:document.getElementById('op').value,new_password:document.getElementById('np').value,email:document.getElementById('ce').value});if(r)to('Пароль изменён!')}
async function pp(){const c=document.getElementById('ptxt').value.trim();if(!c)return to('Напишите текст!','e');if(!uid)return to('Войдите!','e');await api('POST','/post',{content:c,user_id:parseInt(uid)});to('Опубликовано!');cm('postModal');document.getElementById('ptxt').value='';document.getElementById('cc').textContent='0';sp('feed')}
async function lp(pid,b){if(!uid)return to('Войдите!','e');const r=await api('POST','/like/'+pid);if(r){b.classList.add('liked');setTimeout(()=>b.classList.remove('liked'),600);const lc=b.querySelector('.lc');lc.textContent=parseInt(lc.textContent)+1}}

async function sp(pg,pr=null){
    const c=document.getElementById('ct');
    if(pg==='feed'){
        c.innerHTML='<div style="text-align:center;padding:40px">Загрузка...</div>';
        const ps=await api('GET','/posts');
        c.innerHTML=(ps&&ps.length?ps.map(p=>`<div class="card"><div class="ph"><div class="pa" onclick="spr('${p.author.username}')"><div class="av">${p.author.avatar_url?`<img src="${p.author.avatar_url}">`:p.author.username[0]}</div><span>${p.author.username}</span>${bh(p.author.verified,p.author.badge_type)}</div><span class="pt">${new Date(p.timestamp).toLocaleString('ru-RU')}</span></div><div class="pc">${pc(p.content)}</div><div class="pact"><button class="abtn" onclick="lp(${p.id},this)">❤️ <span class="lc">${p.likes}</span></button></div></div>`).join(''):'<div class="card" style="text-align:center">Пока нет постов 🐤</div>');
    }else if(pg==='profile'){
        c.innerHTML='<div style="text-align:center;padding:40px">Загрузка...</div>';
        const d=await api('GET','/user/'+pr);if(!d)return sp('feed');
        const u=d.user,fs=d.friends||[],mt=await gmt(pr);
        c.innerHTML=`<div style="text-align:center;padding:10px"><div class="pav">${u.avatar_url?`<img src="${u.avatar_url}">`:u.username[0]}</div><h2>${od(u)}${u.username} ${bh(u.verified,u.badge_type)}</h2><p style="color:var(--td)">${u.bio||''}</p>${uid&&pr!==un?`<button class="btn ${sub.includes(pr)?'bo':'bp'} btn-sm" onclick="ts('${pr}')">${sub.includes(pr)?'Отписаться':'Подписаться'}</button>`:''}${uid&&pr!==un?`<button class="btn bp btn-sm" onclick="sfr('${pr}')" style="margin-left:4px">👥 В друзья</button>`:''}<div style="margin-top:8px"><b>Друзья:</b> ${fs.map(f=>`<span style="cursor:pointer;color:var(--m)" onclick="spr('${f.username}')">${f.username}</span>`).join(', ')||'нет'}</div>${mt.length?`<div style="margin-top:4px"><b>Общие:</b> ${mt.map(f=>`<span style="cursor:pointer;color:var(--m)" onclick="spr('${f.username}')">${f.username}</span>`).join(', ')}</div>`:''}</div>`;
        c.innerHTML+=(d.posts&&d.posts.length?d.posts.map(p=>`<div class="card"><div class="ph"><span class="pt">${new Date(p.timestamp).toLocaleString('ru-RU')}</span></div><div class="pc">${pc(p.content)}</div><div class="pact">❤️ ${p.likes}</div></div>`).join(''):'<div class="card" style="text-align:center">Нет постов</div>');
    }else if(pg==='hash'){
        c.innerHTML='<div style="text-align:center;padding:40px">Загрузка...</div>';
        const ps=await api('GET','/posts'),ht={};
        if(ps)ps.forEach(p=>{const t=p.content.match(/#(\w+)/g);if(t)t.forEach(x=>{const w=x.slice(1).toLowerCase();ht[w]=(ht[w]||0)+1})});
        const s=Object.entries(ht).sort((a,b)=>b[1]-a[1]).slice(0,100);
        c.innerHTML='<h2 style="color:var(--pg);margin-bottom:10px">🔥 Топ хештегов</h2><div style="display:flex;flex-wrap:wrap;gap:6px">'+(s.length?s.map(([t,n])=>`<span style="padding:6px 12px;background:rgba(0,204,170,0.15);border:1px solid var(--h);border-radius:14px;cursor:pointer;font-size:12px;color:var(--h)" onclick="sh('${t}')">#${t} (${n})</span>`).join(''):'Нет')+'</div>';
    }else if(pg==='friends'){
        if(!uid)return c.innerHTML='<div class="card">Войдите</div>';
        c.innerHTML='<div style="text-align:center;padding:40px">Загрузка...</div>';
        const rs=await api('GET','/friend-requests/'+uid),fs=await api('GET','/friends/'+uid);
        let h='<h2 style="color:var(--pg);margin-bottom:10px">👥 Друзья</h2><div style="margin-bottom:8px"><input type="text" id="fs" placeholder="Ник друга" style="width:auto;display:inline;margin-right:6px"><button class="btn bp btn-sm" onclick="sfr(document.getElementById(\'fs\').value)">Добавить</button></div>';
        if(rs&&rs.incoming&&rs.incoming.length){h+='<h4 style="color:var(--pg);margin:8px 0">Входящие заявки</h4>';rs.incoming.forEach(r=>h+=`<div class="fitm"><span onclick="spr('${r.from.username}')" style="cursor:pointer">${r.from.username}</span><div><button class="btn bs btn-sm" onclick="ar(${r.id})">✓</button><button class="btn bd btn-sm" onclick="rr(${r.id})">✕</button></div></div>`)}
        if(rs&&rs.outgoing&&rs.outgoing.length){h+='<h4 style="color:var(--td);margin:8px 0">Исходящие</h4>';rs.outgoing.forEach(r=>h+=`<div class="fitm"><span>${r.to.username}</span><span style="color:var(--td);font-size:10px">ожидание</span></div>`)}
        h+='<h4 style="color:var(--pg);margin:8px 0">Список друзей</h4>';
        if(fs&&fs.length)fs.forEach(f=>h+=`<div class="fitm"><span onclick="spr('${f.username}')" style="cursor:pointer">${od(f)}${f.username}</span><button class="btn bo btn-sm" onclick="stc(${f.id},'${f.username}')">💬</button></div>`);
        else h+='<p style="color:var(--td)">Нет друзей</p>';
        c.innerHTML=h;
    }else if(pg==='msg'){
        if(!uid)return c.innerHTML='<div class="card">Войдите</div>';
        c.innerHTML='<div style="text-align:center;padding:40px">Загрузка...</div>';
        const cs=await api('GET','/chats/'+uid);
        let h='<h2 style="color:var(--pg);margin-bottom:10px">💬 Сообщения</h2><button class="btn bp btn-sm" onclick="showCreateChat()" style="margin-bottom:8px">+ Создать чат</button><div style="display:flex;gap:8px"><div style="width:35%;border-right:1px solid var(--b);padding-right:6px">';
        if(cs&&cs.length)cs.forEach(c=>{let n=c.name||'Чат';if(!c.is_group&&c.members){const o=c.members.find(m=>m.username!==un);if(o)n=o.username}h+=`<div style="padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center" onclick="oc(${c.id})"><span>${n}</span><span class="chat-info-btn" onclick="event.stopPropagation();showChatInfo(${c.id})">ℹ</span></div>`});
        else h+='<p style="color:var(--td);font-size:11px">Нет чатов</p>';
        h+='</div><div style="width:65%" id="ca"><p style="color:var(--td);text-align:center;padding:20px">Выберите чат</p></div></div>';
        c.innerHTML=h;
    }
}

function spr(u){sp('profile',u)}
function sh(t){api('GET','/posts').then(ps=>{const f=ps?ps.filter(p=>{const ts=p.content.match(/#(\w+)/g);return ts&&ts.some(x=>x.slice(1).toLowerCase()===t.toLowerCase())}):[];document.getElementById('ct').innerHTML=`<h2 style="color:var(--h)">#${t}</h2>${f.length?f.map(p=>`<div class="card"><div class="ph"><div class="pa" onclick="spr('${p.author.username}')"><div class="av">${p.author.avatar_url?`<img src="${p.author.avatar_url}">`:p.author.username[0]}</div><span>${p.author.username}</span>${bh(p.author.verified,p.author.badge_type)}</div><span class="pt">${new Date(p.timestamp).toLocaleString('ru-RU')}</span></div><div class="pc">${pc(p.content)}</div></div>`).join(''):'<div class="card">Нет постов</div>'}<button class="btn bo btn-sm" onclick="sp(\'hash\')">← Назад</button>`})}
async function sfr(n){if(!n)return to('Введите ник','e');const r=await api('POST','/friend-request',{from_id:parseInt(uid),to_username:n});if(r){to('Заявка отправлена!');sp('friends')}}
async function ar(rid){await api('POST','/friend-request/'+rid+'/accept');to('Принято!');sp('friends')}
async function rr(rid){await api('POST','/friend-request/'+rid+'/reject');sp('friends')}
async function gmt(u){if(!uid)return[];const d=await api('GET','/mutual-friends/'+uid+'/'+u);return d||[]}

function showCreateChat(){
    const m=document.createElement('div');m.className='modal-bg on';m.onclick=function(e){if(e.target===m)m.remove()};
    m.innerHTML=`<div class="modal"><div class="modal-h"><h3 style="color:var(--pg)">Создать чат</h3><span onclick="this.closest('.modal-bg').remove()" style="cursor:pointer;font-size:20px">&times;</span></div>
    <input type="text" id="chatName" placeholder="Название чата" style="margin-bottom:8px">
    <input type="text" id="chatMembers" placeholder="Ники участников через запятую" style="margin-bottom:8px">
    <label style="font-size:12px;color:var(--td);display:flex;align-items:center;gap:6px;margin-bottom:8px"><input type="checkbox" id="isGroup" style="width:auto"> Групповой чат</label>
    <button class="btn bp" onclick="createChatFromModal()" style="width:100%">Создать</button></div>`;
    document.body.appendChild(m)
}

async function createChatFromModal(){
    const name=document.getElementById('chatName').value.trim(),membersStr=document.getElementById('chatMembers').value.trim(),isGroup=document.getElementById('isGroup').checked;
    if(!name)return to('Введите название','e');
    const r=await api('POST','/chat',{creator_id:parseInt(uid),name,is_group:isGroup});
    if(r){
        if(membersStr){
            const members=membersStr.split(',').map(s=>s.trim()).filter(s=>s);
            for(const m of members){await api('POST','/chat/'+r.id+'/invite',{username:m})}
        }
        to('Чат создан!');document.querySelector('.modal-bg.on')?.remove();sp('msg');
    }
}

async function showChatInfo(cid){
    const chats=await api('GET','/chats/'+uid),chat=chats?chats.find(c=>c.id===cid):null;
    if(!chat)return;
    const m=document.createElement('div');m.className='modal-bg on';m.onclick=function(e){if(e.target===m)m.remove()};
    m.innerHTML=`<div class="modal"><div class="modal-h"><h3 style="color:var(--pg)">${chat.name||'Чат'}</h3><span onclick="this.closest('.modal-bg').remove()" style="cursor:pointer;font-size:20px">&times;</span></div>
    <p style="color:var(--td);font-size:11px">Участники: ${chat.members?chat.members.map(m=>m.username).join(', '):''}</p>
    <input type="text" id="inviteUser" placeholder="Ник для приглашения" style="margin:8px 0">
    <button class="btn bp btn-sm" onclick="inviteToChat(${cid})">Пригласить</button></div>`;
    document.body.appendChild(m)
}

async function inviteToChat(cid){
    const u=document.getElementById('inviteUser').value.trim();
    if(!u)return to('Введите ник','e');
    const r=await api('POST','/chat/'+cid+'/invite',{username:u});
    if(r){to('Приглашён!');document.querySelector('.modal-bg.on')?.remove();sp('msg')}
}

async function stc(oid){const r=await api('POST','/chat',{creator_id:parseInt(uid),other_user_id:oid,is_group:false});if(r){to('Чат открыт!');sp('msg')}}
async function oc(cid){
    currentChatId=cid;
    const ms=await api('GET','/chat/'+cid+'/messages'),ca=document.getElementById('ca');
    if(!ca)return;
    let h='';if(ms&&ms.length)ms.forEach(m=>{h+=`<div class="msg ${m.sender.id==uid?'msg-m':'msg-o'}"><b>${m.sender.username}</b><br>${m.content}<br><span style="font-size:9px;color:var(--td)">${new Date(m.timestamp).toLocaleTimeString('ru-RU')}</span></div>`});
    h+=`<div style="margin-top:8px;display:flex;gap:4px"><input type="text" id="mi" placeholder="Сообщение..." style="flex:1"><button class="btn bp btn-sm" onclick="sm(${cid})">➤</button></div>`;
    ca.innerHTML=h;document.getElementById('mi')?.focus();document.getElementById('mi')?.addEventListener('keypress',e=>{if(e.key==='Enter')sm(cid)});
    ca.scrollTop=ca.scrollHeight
}
async function sm(cid){const i=document.getElementById('mi');if(!i||!i.value.trim())return;await api('POST','/chat/'+cid+'/message',{sender_id:parseInt(uid),content:i.value.trim()});i.value='';oc(cid)}

async function checkUnread(){
    if(!uid)return;
    const cs=await api('GET','/chats/'+uid);
    let count=0;
    if(cs)cs.forEach(c=>{if(unread[c.id])count++});
    const msgBtn=document.getElementById('msgBtn');
    if(count>0){
        if(!msgBtn.querySelector('.unread-badge')){
            const badge=document.createElement('span');badge.className='unread-badge';badge.textContent=count;msgBtn.appendChild(badge)
        }else msgBtn.querySelector('.unread-badge').textContent=count;
    }else{const b=msgBtn.querySelector('.unread-badge');if(b)b.remove()}
}

function startAutoRefresh(){
    stopAutoRefresh();
    refreshTimer=setInterval(()=>{if(document.getElementById('ct').querySelector('.card')||document.getElementById('ct').querySelector('.msg'))sp(currentPage||'feed')},10000);
    if(uid)chatRefresh=setInterval(checkUnread,5000)
}
function stopAutoRefresh(){if(refreshTimer)clearInterval(refreshTimer);if(chatRefresh)clearInterval(chatRefresh)}

document.getElementById('ptxt').addEventListener('input',function(){document.getElementById('cc').textContent=this.value.length});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-bg')&&!e.target.querySelector('.modal'))e.target.classList.remove('on')});
st(localStorage.getItem('th')||'dark');unv();sp('feed');if(uid)startAutoRefresh();
</script>
</body>
</html>
