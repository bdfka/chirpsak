<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐤 Chirper — 3D Edition</title>
    <style>
        :root {
            --bg: #06060f;
            --card-bg: rgba(15, 15, 40, 0.8);
            --primary: #0088ff;
            --primary-glow: #00bbff;
            --accent: #0066dd;
            --text: #e0e8ff;
            --text-dim: #88aacc;
            --border: rgba(0, 150, 255, 0.2);
            --success: #00ff88;
            --danger: #ff4477;
            --hashtag: #00ccaa;
            --mention: #ffaa00;
            --white: #ffffff;
            --gray: #888888;
            --blue: #0088ff;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
            background:var(--bg);color:var(--text);
            width:100vw;height:100vh;overflow:hidden;
            display:flex;flex-direction:column;
        }
        .bg-animation{
            position:fixed;top:0;left:0;width:100%;height:100%;
            pointer-events:none;z-index:0;
            background:
                radial-gradient(ellipse at 20% 50%,rgba(0,120,255,0.08) 0%,transparent 50%),
                radial-gradient(ellipse at 80% 20%,rgba(0,180,255,0.06) 0%,transparent 50%),
                radial-gradient(ellipse at 50% 80%,rgba(0,100,255,0.05) 0%,transparent 50%);
        }
        .grid-overlay{
            position:fixed;top:0;left:0;width:100%;height:100%;
            pointer-events:none;z-index:0;opacity:0.05;
            background-image:
                linear-gradient(rgba(0,150,255,0.3) 1px,transparent 1px),
                linear-gradient(90deg,rgba(0,150,255,0.3) 1px,transparent 1px);
            background-size:50px 50px;
            animation:gridMove 20s linear infinite;
        }
        @keyframes gridMove{
            0%{transform:perspective(500px) rotateX(60deg) translateY(0)}
            100%{transform:perspective(500px) rotateX(60deg) translateY(50px)}
        }
        .particle{
            position:fixed;pointer-events:none;z-index:0;
            width:2px;height:2px;background:var(--primary);
            border-radius:50%;
            box-shadow:0 0 6px var(--primary-glow),0 0 12px var(--primary);
            animation:floatUp linear infinite;
        }
        @keyframes floatUp{
            0%{transform:translateY(100vh) scale(0);opacity:0}
            10%{opacity:1}90%{opacity:1}
            100%{transform:translateY(-10vh) scale(1.5);opacity:0}
        }
        .app{position:relative;z-index:1;width:100%;height:100vh;display:flex;flex-direction:column}
        .navbar{
            z-index:100;background:var(--card-bg);
            backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border);
            padding:10px 20px;display:flex;justify-content:space-between;align-items:center;
            box-shadow:0 5px 30px rgba(0,0,0,0.5);flex-shrink:0;
        }
        .logo{
            font-size:22px;font-weight:800;
            background:linear-gradient(135deg,var(--primary-glow),#fff,var(--primary));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            filter:drop-shadow(0 0 10px rgba(0,187,255,0.5));
            cursor:pointer;text-decoration:none;
        }
        .nav-actions{display:flex;gap:8px;align-items:center}
        .verified-badge{
            display:inline-flex;align-items:center;justify-content:center;
            width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:bold;
            box-shadow:0 0 10px rgba(0,136,255,0.5);animation:verifiedPulse 2s ease-in-out infinite;
        }
        .verified-white{background:linear-gradient(135deg,#ffffff,#cccccc);color:#000;box-shadow:0 0 12px rgba(255,255,255,0.6)}
        .verified-gray{background:linear-gradient(135deg,#888888,#666666);color:#fff;box-shadow:0 0 12px rgba(136,136,136,0.6)}
        .verified-blue{background:linear-gradient(135deg,#0088ff,#00ccff);color:#fff;box-shadow:0 0 12px rgba(0,136,255,0.6)}
        @keyframes verifiedPulse{
            0%,100%{transform:scale(1)}50%{transform:scale(1.15)}
        }
        .btn{
            padding:8px 14px;border-radius:10px;border:none;cursor:pointer;
            font-weight:600;font-size:12px;transition:all 0.3s ease;
            display:inline-flex;align-items:center;gap:5px;color:#fff;
        }
        .btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 3px 12px rgba(0,136,255,0.4)}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 20px rgba(0,136,255,0.6)}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
        .btn-outline:hover{border-color:var(--primary);box-shadow:0 0 12px rgba(0,136,255,0.3);background:rgba(0,136,255,0.1)}
        .btn-danger{background:var(--danger)}
        .btn-icon{
            width:42px;height:42px;border-radius:50%;
            background:linear-gradient(135deg,var(--primary),var(--accent));
            border:none;color:#fff;font-size:20px;cursor:pointer;
            box-shadow:0 4px 18px rgba(0,136,255,0.4);transition:all 0.3s ease;
            display:flex;align-items:center;justify-content:center;
            position:fixed;bottom:20px;right:20px;z-index:150;
        }
        .btn-icon:hover{transform:scale(1.1);box-shadow:0 6px 25px rgba(0,136,255,0.7)}
        .layout{display:flex;flex:1;overflow:hidden}
        .sidebar{
            width:240px;background:var(--card-bg);backdrop-filter:blur(20px);
            border-right:1px solid var(--border);padding:14px;
            overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;gap:8px;
        }
        .main-content{flex:1;overflow-y:auto;padding:16px 20px}
        .card{
            background:var(--card-bg);backdrop-filter:blur(20px);
            border:1px solid var(--border);border-radius:14px;
            padding:16px;margin-bottom:12px;
            box-shadow:0 6px 20px rgba(0,0,0,0.4),0 0 12px rgba(0,136,255,0.06);
            transition:all 0.3s ease;animation:cardAppear 0.5s ease-out;
        }
        @keyframes cardAppear{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
        .card:hover{border-color:rgba(0,150,255,0.4);box-shadow:0 10px 30px rgba(0,0,0,0.5),0 0 25px rgba(0,136,255,0.12)}
        .post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
        .post-author{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
        .post-author:hover{color:var(--primary-glow)}
        .post-avatar{
            width:34px;height:34px;border-radius:50%;overflow:hidden;
            background:linear-gradient(135deg,var(--primary),var(--accent));
            display:flex;align-items:center;justify-content:center;
            font-size:14px;box-shadow:0 0 10px rgba(0,136,255,0.3);flex-shrink:0;
            color:#fff;font-weight:700;
        }
        .post-avatar img{width:100%;height:100%;object-fit:cover}
        .post-time{color:var(--text-dim);font-size:10px}
        .post-content{font-size:14px;line-height:1.5;margin-bottom:10px;color:#dde4ff;word-break:break-word}
        .mention{color:var(--mention);cursor:pointer;font-weight:600}
        .mention:hover{text-decoration:underline}
        .hashtag{color:var(--hashtag);cursor:pointer;font-weight:600}
        .hashtag:hover{text-decoration:underline}
        .post-actions{display:flex;gap:12px}
        .action-btn{
            background:none;border:none;color:var(--text-dim);cursor:pointer;
            font-size:12px;display:flex;align-items:center;gap:4px;
            padding:5px 10px;border-radius:6px;transition:all 0.3s ease;
        }
        .action-btn:hover{color:var(--primary-glow);background:rgba(0,136,255,0.1)}
        .action-btn.liked{color:#ff4477;animation:heartBeat 0.6s ease}
        @keyframes heartBeat{0%{transform:scale(1)}25%{transform:scale(1.3)}50%{transform:scale(0.9)}100%{transform:scale(1)}}
        input,textarea,select{
            width:100%;padding:10px 14px;background:rgba(0,30,60,0.5);
            border:1px solid var(--border);border-radius:10px;
            color:var(--text);font-size:13px;outline:none;
            font-family:inherit;transition:all 0.3s ease;
        }
        textarea{resize:vertical;min-height:100px}
        input:focus,textarea:focus,select:focus{
            border-color:var(--primary);box-shadow:0 0 18px rgba(0,136,255,0.3);background:rgba(0,40,80,0.5)
        }
        select{appearance:none;cursor:pointer}
        .modal-overlay{
            display:none;position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);
            z-index:200;justify-content:center;align-items:center;
        }
        .modal-overlay.active{display:flex}
        .modal{
            background:rgba(10,10,35,0.95);backdrop-filter:blur(30px);
            border:1px solid var(--border);border-radius:18px;
            padding:24px;max-width:460px;width:90%;max-height:90vh;overflow-y:auto;
            box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 60px rgba(0,136,255,0.2);
            animation:modalIn 0.4s ease;
        }
        @keyframes modalIn{0%{opacity:0;transform:scale(0.85) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
        .modal-close{background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer}
        .modal-close:hover{color:var(--danger)}
        .toast{
            position:fixed;top:16px;right:16px;z-index:300;
            padding:12px 18px;border-radius:10px;font-weight:600;font-size:13px;
            backdrop-filter:blur(20px);
            animation:toastIn 0.4s ease,toastOut 0.4s ease 3s forwards;
        }
        @keyframes toastIn{0%{opacity:0;transform:translateX(60px)}100%{opacity:1;transform:translateX(0)}}
        @keyframes toastOut{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(60px)}}
        .toast-success{background:rgba(0,255,136,0.2);border:1px solid rgba(0,255,136,0.4);color:#00ff88}
        .toast-error{background:rgba(255,68,119,0.2);border:1px solid rgba(255,68,119,0.4);color:#ff4477}
        .profile-avatar-large{
            width:80px;height:80px;border-radius:50%;overflow:hidden;
            background:linear-gradient(135deg,var(--primary),var(--accent));
            display:flex;align-items:center;justify-content:center;
            font-size:32px;margin:0 auto 12px;
            box-shadow:0 0 25px rgba(0,136,255,0.4);color:#fff;font-weight:700;
        }
        .profile-avatar-large img{width:100%;height:100%;object-fit:cover}
        .subscribe-btn{padding:8px 22px;border-radius:18px;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.3s ease}
        .subscribe-btn.follow{background:var(--primary);color:#fff;border:none}
        .subscribe-btn.unfollow{background:transparent;color:var(--danger);border:1px solid var(--danger)}
        .hashtag-list{display:flex;flex-wrap:wrap;gap:6px}
        .hashtag-item{
            padding:5px 12px;background:rgba(0,204,170,0.15);
            border:1px solid rgba(0,204,170,0.3);border-radius:16px;
            cursor:pointer;font-size:12px;color:var(--hashtag);transition:all 0.3s ease;
        }
        .hashtag-item:hover{background:rgba(0,204,170,0.3);box-shadow:0 0 12px rgba(0,204,170,0.3)}
        .settings-section{margin-bottom:16px}
        .settings-section h4{color:var(--primary-glow);margin-bottom:8px;font-size:13px}
        .admin-btn{
            position:fixed;bottom:72px;right:20px;z-index:150;
            width:32px;height:32px;border-radius:50%;
            background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);
            color:rgba(255,255,255,0.4);cursor:pointer;font-size:12px;
            transition:all 0.3s ease;display:flex;align-items:center;justify-content:center;
        }
        .admin-btn:hover{color:var(--primary-glow);border-color:var(--primary);box-shadow:0 0 10px rgba(0,136,255,0.3)}
        .admin-console{
            display:none;position:fixed;bottom:115px;right:20px;z-index:150;
            background:rgba(10,10,30,0.95);border:1px solid var(--border);
            border-radius:12px;padding:14px;width:260px;
            box-shadow:0 12px 35px rgba(0,0,0,0.7);
        }
        .admin-console.active{display:block;animation:modalIn 0.3s ease}
        .admin-console h5{color:var(--primary-glow);margin-bottom:8px;font-size:13px}
        .admin-console input,.admin-console select{width:100%;padding:6px;margin-bottom:6px;font-size:11px}
        .admin-console .hint{color:var(--text-dim);font-size:10px;margin-bottom:6px}
        label{display:block;color:var(--text-dim);font-size:11px;margin-bottom:3px}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        @media(max-width:768px){.sidebar{display:none}.btn-icon{bottom:14px;right:14px}}
        .avatar-upload{cursor:pointer;text-align:center;color:var(--primary);font-size:12px}
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="grid-overlay"></div>
    <div id="particles"></div>
    <div id="toastContainer"></div>

    <div class="app">
        <nav class="navbar">
            <a class="logo" onclick="showPage('feed')">🐤 Chirper</a>
            <div class="nav-actions" id="navActions">
                <button class="btn btn-outline btn-sm" onclick="openModal('loginModal')">Войти</button>
                <button class="btn btn-primary btn-sm" onclick="openModal('registerModal')">Регистрация</button>
            </div>
        </nav>
        <div class="layout">
            <aside class="sidebar" id="sidebar">
                <button class="btn btn-outline" onclick="showPage('feed')" style="width:100%">📡 Лента</button>
                <button class="btn btn-outline" onclick="showPage('hashtags')" style="width:100%">🔥 Топ хештегов</button>
                <button class="btn btn-outline" onclick="openModal('settingsModal')" style="width:100%" id="settingsBtn" disabled>⚙ Настройки</button>
                <div id="subscriptionsBlock" style="margin-top:8px"></div>
            </aside>
            <main class="main-content" id="content"></main>
        </div>
    </div>

    <button class="btn-icon" onclick="openModal('postModal')">+</button>
    <button class="admin-btn" onclick="toggleAdminConsole()">⚙</button>

    <div class="admin-console" id="adminConsole">
        <h5>🔐 Админ-консоль</h5>
        <input type="password" id="adminPassword" placeholder="Пароль">
        <label>Тип галочки</label>
        <select id="adminBadgeType">
            <option value="white">Белая</option>
            <option value="gray">Серая</option>
            <option value="blue">Синяя</option>
        </select>
        <input type="text" id="adminCommand" placeholder="verify ник">
        <div class="hint">verify [ник] — выдать галочку</div>
        <button class="btn btn-primary btn-sm" onclick="execAdmin()" style="width:100%">OK</button>
        <div id="adminResult" style="margin-top:5px;font-size:10px"></div>
    </div>

    <!-- Пост -->
    <div class="modal-overlay" id="postModal">
        <div class="modal">
            <div class="modal-header"><h3 style="color:var(--primary-glow)">Новый чирик</h3><button class="modal-close" onclick="closeModal('postModal')">&times;</button></div>
            <textarea id="newPostContent" placeholder="Что нового? @пользователь #хештег" maxlength="280"></textarea>
            <div style="margin-top:6px;font-size:10px;color:var(--text-dim)"><span id="charCount">0</span>/280 • @упоминание • #хештег</div>
            <button class="btn btn-primary" onclick="publishPost()" style="margin-top:10px;width:100%">🚀 Опубликовать</button>
        </div>
    </div>

    <!-- Вход -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <div class="modal-header"><h3 style="color:var(--primary-glow)">Вход</h3><button class="modal-close" onclick="closeModal('loginModal')">&times;</button></div>
            <input type="email" id="loginEmail" placeholder="Email" style="margin-bottom:8px">
            <input type="password" id="loginPassword" placeholder="Пароль" style="margin-bottom:8px">
            <button class="btn btn-primary" onclick="login()" style="width:100%">Войти</button>
        </div>
    </div>

    <!-- Регистрация -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal">
            <div class="modal-header"><h3 style="color:var(--primary-glow)">Регистрация</h3><button class="modal-close" onclick="closeModal('registerModal')">&times;</button></div>
            <input type="text" id="regUsername" placeholder="Имя" style="margin-bottom:8px">
            <input type="email" id="regEmail" placeholder="Email" style="margin-bottom:8px">
            <input type="password" id="regPassword" placeholder="Пароль" style="margin-bottom:8px">
            <button class="btn btn-primary" onclick="register()" style="width:100%">Создать</button>
        </div>
    </div>

    <!-- Настройки -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header"><h3 style="color:var(--primary-glow)">⚙ Настройки</h3><button class="modal-close" onclick="closeModal('settingsModal')">&times;</button></div>
            <div class="settings-section">
                <h4>Аватар</h4>
                <input type="file" id="avatarFile" accept="image/*" style="margin-bottom:6px">
                <button class="btn btn-primary btn-sm" onclick="uploadAvatar()">Загрузить</button>
            </div>
            <div class="settings-section">
                <h4>Сменить ник</h4>
                <input type="text" id="newUsername" placeholder="Новый ник" style="margin-bottom:6px">
                <button class="btn btn-primary btn-sm" onclick="changeUsername()">Сменить</button>
            </div>
            <div class="settings-section">
                <h4>Описание</h4>
                <textarea id="newBio" placeholder="О себе..." maxlength="200" style="min-height:60px;margin-bottom:6px"></textarea>
                <button class="btn btn-primary btn-sm" onclick="changeBio()">Сохранить</button>
            </div>
            <div class="settings-section">
                <h4>Сменить пароль</h4>
                <input type="password" id="oldPassword" placeholder="Старый пароль" style="margin-bottom:6px">
                <input type="password" id="newPassword" placeholder="Новый пароль" style="margin-bottom:6px">
                <input type="email" id="confirmEmail" placeholder="Email для подтверждения" style="margin-bottom:6px">
                <button class="btn btn-danger btn-sm" onclick="changePassword()">Сменить пароль</button>
            </div>
        </div>
    </div>

    <script>
        const API = 'https://chirper-api-abc.onrender.com';
        const ADMIN_PASS = 'bdfkatop123';
        let uid = localStorage.getItem('uid');
        let uname = localStorage.getItem('uname');
        let vrf = localStorage.getItem('vrf');
        let vrfType = localStorage.getItem('vrf_type') || '';
        let subs = JSON.parse(localStorage.getItem('subs') || '[]');
        let currentPage = 'feed';
        let profileUser = null;

        function createParticles(){
            const c=document.getElementById('particles');
            for(let i=0;i<50;i++){
                const p=document.createElement('div');
                p.className='particle';
                p.style.left=Math.random()*100+'%';
                p.style.animationDuration=(4+Math.random()*8)+'s';
                p.style.animationDelay=Math.random()*8+'s';
                p.style.width=(1+Math.random()*3)+'px';
                p.style.height=p.style.width;
                c.appendChild(p);
            }
        }

        function toast(m,t='success'){
            const c=document.getElementById('toastContainer');
            const d=document.createElement('div');
            d.className=`toast toast-${t}`;
            d.textContent=m;
            c.appendChild(d);
            setTimeout(()=>d.remove(),3400);
        }

        function openModal(id){document.getElementById(id).classList.add('active')}
        function closeModal(id){document.getElementById(id).classList.remove('active')}

        function getBadgeClass(type){
            if(type==='white') return 'verified-white';
            if(type==='gray') return 'verified-gray';
            return 'verified-blue';
        }

        function getBadgeSymbol(type){
            if(type==='white') return '◇';
            if(type==='gray') return '◆';
            return '✓';
        }

        function badgeHtml(v,t){
            if(!v||v==='false') return '';
            const cls=getBadgeClass(t||'blue');
            const sym=getBadgeSymbol(t||'blue');
            return `<span class="verified-badge ${cls}" title="${t||'blue'}">${sym}</span>`;
        }

        async function api(method, endpoint, data=null){
            const h={'Content-Type':'application/json'};
            try{
                const r=await fetch(`${API}${endpoint}`,{method,headers:h,body:data?JSON.stringify(data):null});
                const j=await r.json();
                if(!r.ok) throw new Error(j.error||'Error');
                return j;
            }catch(e){toast(e.message,'error');return null}
        }

        async function apiForm(endpoint, formData){
            try{
                const r=await fetch(`${API}${endpoint}`,{method:'POST',body:formData});
                const j=await r.json();
                if(!r.ok) throw new Error(j.error||'Error');
                return j;
            }catch(e){toast(e.message,'error');return null}
        }

        // Админ
        function toggleAdminConsole(){
            document.getElementById('adminConsole').classList.toggle('active');
        }
        async function execAdmin(){
            const pw=document.getElementById('adminPassword').value;
            const cmd=document.getElementById('adminCommand').value.trim();
            const type=document.getElementById('adminBadgeType').value;
            const res=document.getElementById('adminResult');
            if(pw!==ADMIN_PASS){res.innerHTML='<span style="color:#f44">Неверный пароль</span>';return}
            if(!cmd.startsWith('verify ')){res.innerHTML='<span style="color:#f44">verify [ник]</span>';return}
            const target=cmd.replace('verify ','').trim();
            const data=await api('POST','/verify',{username:target,badge_type:type});
            if(data){
                res.innerHTML=`<span style="color:#0f8">✅ ${data.message}</span>`;
                if(uname===target){vrf='true';vrfType=type;localStorage.setItem('vrf','true');localStorage.setItem('vrf_type',type);updateNav()}
                showPage(currentPage);
            }
        }

        // Аватар
        async function uploadAvatar(){
            const file=document.getElementById('avatarFile').files[0];
            if(!file){toast('Выберите файл','error');return}
            if(!uid){toast('Войдите','error');return}
            const fd=new FormData();
            fd.append('avatar',file);
            fd.append('user_id',uid);
            const data=await apiForm('/upload-avatar',fd);
            if(data) toast('Аватар обновлён!');
        }

        // Регистрация/Вход
        async function register(){
            const u=document.getElementById('regUsername').value.trim();
            const e=document.getElementById('regEmail').value.trim();
            const p=document.getElementById('regPassword').value;
            const r=await api('POST','/register',{username:u,email:e,password:p});
            if(r){
                uid=r.user_id;uname=r.username;vrf=r.verified?'true':'false';vrfType=r.badge_type||'';
                localStorage.setItem('uid',uid);localStorage.setItem('uname',uname);
                localStorage.setItem('vrf',vrf);localStorage.setItem('vrf_type',vrfType);
                closeModal('registerModal');updateNav();showPage('feed');
                toast(`Добро пожаловать, ${uname}!`);
            }
        }
        async function login(){
            const e=document.getElementById('loginEmail').value.trim();
            const p=document.getElementById('loginPassword').value;
            const r=await api('POST','/login',{email:e,password:p});
            if(r){
                uid=r.user_id;uname=r.username;vrf=r.verified?'true':'false';vrfType=r.badge_type||'';
                localStorage.setItem('uid',uid);localStorage.setItem('uname',uname);
                localStorage.setItem('vrf',vrf);localStorage.setItem('vrf_type',vrfType);
                closeModal('loginModal');updateNav();showPage('feed');
                toast(`С возвращением, ${uname}!`);
            }
        }
        function logout(){
            uid=null;uname=null;vrf='false';vrfType='';
            localStorage.clear();subs=[];
            updateNav();showPage('feed');
        }

        // Смена данных
        async function changeUsername(){
            const nu=document.getElementById('newUsername').value.trim();
            if(!nu)return toast('Введите ник','error');
            const data=await api('POST','/update-profile',{user_id:parseInt(uid),username:nu});
            if(data){uname=nu;localStorage.setItem('uname',uname);updateNav();toast('Ник изменён!')}
        }
        async function changeBio(){
            const bio=document.getElementById('newBio').value.trim();
            const data=await api('POST','/update-profile',{user_id:parseInt(uid),bio});
            if(data) toast('Описание сохранено!');
        }
        async function changePassword(){
            const old=document.getElementById('oldPassword').value;
            const np=document.getElementById('newPassword').value;
            const email=document.getElementById('confirmEmail').value;
            if(!old||!np||!email)return toast('Все поля обязательны','error');
            const data=await api('POST','/change-password',{user_id:parseInt(uid),old_password:old,new_password:np,email});
            if(data) toast('Пароль изменён! Проверьте почту.');
        }

        function updateNav(){
            const a=document.getElementById('navActions');
            const sb=document.getElementById('settingsBtn');
            if(uid){
                a.innerHTML=`<span style="font-weight:600">${uname}</span> ${badgeHtml(vrf,vrfType)}
                    <button class="btn btn-outline btn-sm" onclick="showPage('feed')">Лента</button>
                    <button class="btn btn-primary btn-sm" onclick="logout()">Выйти</button>`;
                sb.disabled=false;
            }else{
                a.innerHTML=`<button class="btn btn-outline btn-sm" onclick="openModal('loginModal')">Войти</button>
                    <button class="btn btn-primary btn-sm" onclick="openModal('registerModal')">Регистрация</button>`;
                sb.disabled=true;
            }
            updateSubscriptions();
        }

        function updateSubscriptions(){
            const b=document.getElementById('subscriptionsBlock');
            if(!uid||subs.length===0){b.innerHTML='';return}
            b.innerHTML='<div style="color:var(--text-dim);font-size:11px;margin-bottom:4px">Подписки</div>'+
                subs.map(s=>`<button class="btn btn-outline btn-sm" onclick="showProfile('${s}')" style="width:100%">@${s}</button>`).join('');
        }

        function toggleSub(un){
            const idx=subs.indexOf(un);
            if(idx>=0){subs.splice(idx,1);toast(`Отписались от @${un}`)}
            else{subs.push(un);toast(`Подписались на @${un}`)}
            localStorage.setItem('subs',JSON.stringify(subs));
            updateSubscriptions();
            if(currentPage==='profile'&&profileUser) showProfile(profileUser);
        }

        function parseContent(text){
            return text
                .replace(/@(\w+)/g,'<span class="mention" onclick="showProfile(\'$1\')">@$1</span>')
                .replace(/#(\w+)/g,'<span class="hashtag" onclick="showHashtag(\'$1\')">#$1</span>');
        }

        async function showPage(page, param=null){
            currentPage=page;
            const content=document.getElementById('content');
            content.innerHTML='<div style="text-align:center;padding:40px">Загрузка...</div>';

            if(page==='feed'){
                const posts=await api('GET','/posts');
                let html='';
                if(posts&&posts.length>0){
                    html=posts.map(p=>`
                        <div class="card">
                            <div class="post-header">
                                <div class="post-author" onclick="showProfile('${p.author.username}')">
                                    <div class="post-avatar">${p.author.avatar_url?`<img src="${p.author.avatar_url}" alt="">`:p.author.username[0]}</div>
                                    <span>${p.author.username}</span>
                                    ${badgeHtml(p.author.verified,p.author.badge_type)}
                                </div>
                                <span class="post-time">${new Date(p.timestamp).toLocaleString('ru-RU')}</span>
                            </div>
                            <div class="post-content">${parseContent(p.content)}</div>
                            <div class="post-actions">
                                <button class="action-btn" onclick="likePost(${p.id},this)">❤️ <span class="lc">${p.likes}</span></button>
                            </div>
                        </div>
                    `).join('');
                }else{html='<div class="card" style="text-align:center">Нет постов 🐤</div>'}
                content.innerHTML=html;
            }else if(page==='profile'){
                const data=await api('GET',`/user/${param}`);
                if(!data)return showPage('feed');
                profileUser=param;
                const u=data.user;
                const posts=data.posts||[];
                const isSub=subs.includes(param);
                let html=`
                    <div style="text-align:center;padding:20px 0">
                        <div class="profile-avatar-large">${u.avatar_url?`<img src="${u.avatar_url}" alt="">`:u.username[0]}</div>
                        <h2>${u.username} ${badgeHtml(u.verified,u.badge_type)}</h2>
                        <p style="color:var(--text-dim)">${u.bio||''}</p>
                        ${uid&&param!==uname?`
                            <button class="subscribe-btn ${isSub?'unfollow':'follow'}" onclick="toggleSub('${param}')">
                                ${isSub?'Отписаться':'Подписаться'}
                            </button>
                        `:''}
                    </div>
                `;
                if(posts.length>0){
                    html+=posts.map(p=>`
                        <div class="card">
                            <div class="post-header"><span class="post-time">${new Date(p.timestamp).toLocaleString('ru-RU')}</span></div>
                            <div class="post-content">${parseContent(p.content)}</div>
                            <div class="post-actions"><span style="color:var(--text-dim)">❤️ ${p.likes}</span></div>
                        </div>
                    `).join('');
                }else{html+='<div class="card" style="text-align:center">Нет постов</div>'}
                content.innerHTML=html;
            }else if(page==='hashtags'){
                const posts=await api('GET','/posts');
                const ht={};
                if(posts) posts.forEach(p=>{
                    const tags=p.content.match(/#(\w+)/g);
                    if(tags) tags.forEach(t=>{const w=t.slice(1).toLowerCase();ht[w]=(ht[w]||0)+1});
                });
                const sorted=Object.entries(ht).sort((a,b)=>b[1]-a[1]).slice(0,100);
                let html='<h2 style="color:var(--primary-glow);margin-bottom:14px">🔥 Топ хештегов</h2><div class="hashtag-list">';
                if(sorted.length>0) sorted.forEach(([tag,count])=>html+=`<span class="hashtag-item" onclick="showHashtag('${tag}')">#${tag} (${count})</span>`);
                else html+='<p style="color:var(--text-dim)">Нет хештегов</p>';
                html+='</div>';
                content.innerHTML=html;
            }else if(page==='hashtag'){
                const posts=await api('GET','/posts');
                const filtered=posts?posts.filter(p=>{
                    const tags=p.content.match(/#(\w+)/g);
                    return tags&&tags.some(t=>t.slice(1).toLowerCase()===param.toLowerCase());
                }):[];
                let html=`<h2 style="color:var(--hashtag);margin-bottom:14px">#${param}</h2>`;
                if(filtered.length>0){
                    html+=filtered.map(p=>`
                        <div class="card">
                            <div class="post-header">
                                <div class="post-author" onclick="showProfile('${p.author.username}')">
                                    <div class="post-avatar">${p.author.avatar_url?`<img src="${p.author.avatar_url}" alt="">`:p.author.username[0]}</div>
                                    <span>${p.author.username}</span>
                                    ${badgeHtml(p.author.verified,p.author.badge_type)}
                                </div>
                                <span class="post-time">${new Date(p.timestamp).toLocaleString('ru-RU')}</span>
                            </div>
                            <div class="post-content">${parseContent(p.content)}</div>
                            <div class="post-actions">❤️ ${p.likes}</div>
                        </div>
                    `).join('');
                }else{html+='<div class="card" style="text-align:center">Нет постов</div>'}
                html+=`<button class="btn btn-outline" onclick="showPage('hashtags')" style="margin-top:10px">← Назад</button>`;
                content.innerHTML=html;
            }
        }

        function showProfile(u){showPage('profile',u)}
        function showHashtag(t){showPage('hashtag',t)}

        async function publishPost(){
            const content=document.getElementById('newPostContent').value.trim();
            if(!content){toast('Напишите текст!','error');return}
            if(!uid){toast('Войдите!','error');return}
            const r=await api('POST','/post',{content,user_id:parseInt(uid)});
            if(r){
                toast('Опубликовано!');
                closeModal('postModal');
                document.getElementById('newPostContent').value='';
                document.getElementById('charCount').textContent='0';
                showPage('feed');
            }
        }

        async function likePost(pid,btn){
            if(!uid){toast('Войдите!','error');return}
            const r=await api('POST',`/like/${pid}`);
            if(r){
                btn.querySelector('.lc').textContent=r.likes;
                btn.classList.add('liked');
                setTimeout(()=>btn.classList.remove('liked'),600);
            }
        }

        document.getElementById('newPostContent').addEventListener('input',function(){
            document.getElementById('charCount').textContent=this.value.length;
        });

        document.addEventListener('click',e=>{
            if(e.target.classList.contains('modal-overlay'))e.target.classList.remove('active');
            const ac=document.getElementById('adminConsole'),ab=document.querySelector('.admin-btn');
            if(!ac.contains(e.target)&&e.target!==ab&&ac.classList.contains('active'))ac.classList.remove('active');
        });

        document.addEventListener('keypress',e=>{
            if(e.key==='Enter'){
                if(document.getElementById('loginModal').classList.contains('active'))login();
                if(document.getElementById('registerModal').classList.contains('active'))register();
                if(document.getElementById('adminConsole').classList.contains('active'))execAdmin();
                if(document.getElementById('postModal').classList.contains('active'))publishPost();
            }
        });

        createParticles();
        updateNav();
        showPage('feed');
    </script>
</body>
</html>
